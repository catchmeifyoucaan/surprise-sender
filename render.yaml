services:
  # Main API Service
  - type: web
    name: surprise-sender-api
    env: node
    plan: starter
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: surprise-sender-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://surprise-sender-frontend.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Service
  - type: web
    name: surprise-sender-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://surprise-sender-api.onrender.com
    autoDeploy: true

databases:
  - name: surprise-sender-db
    databaseName: surprise_sender
    user: surprise_sender_user
    plan: starter